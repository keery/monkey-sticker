<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540">
  <defs>
    <!-- Vaporwave sky : cyan haut -> rose bas -->
    <linearGradient id="vsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0d3d"/>
      <stop offset="22%" stop-color="#3a1466"/>
      <stop offset="46%" stop-color="#7a1f8f"/>
      <stop offset="66%" stop-color="#c72b7e"/>
      <stop offset="84%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff5aa6"/>
    </linearGradient>
    <!-- Soleil retro : jaune -> orange -> rose -->
    <linearGradient id="vsSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff27a"/>
      <stop offset="34%" stop-color="#ffd23d"/>
      <stop offset="60%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <!-- Halo cyan derriere le soleil -->
    <radialGradient id="vsHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2de2e6" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#2de2e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>
    <!-- Sol synthwave -->
    <linearGradient id="vsFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0b3f"/>
      <stop offset="100%" stop-color="#12042a"/>
    </linearGradient>
    <!-- Flamant rose -->
    <linearGradient id="vsFlamingo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ec2"/>
      <stop offset="55%" stop-color="#ff4d9e"/>
      <stop offset="100%" stop-color="#e01f7a"/>
    </linearGradient>
    <!-- Tronc palmier neon -->
    <linearGradient id="vsTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a86"/>
      <stop offset="100%" stop-color="#0e3d47"/>
    </linearGradient>
    <clipPath id="vsSunClip">
      <circle cx="560" cy="240" r="128"/>
    </clipPath>
    <filter id="vsGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="vsGlowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- feuille de palmier -->
    <path id="vsFrond" d="M0 0 C40 -6 92 -30 138 -74 C112 -34 118 -30 148 -40 C118 -12 122 -8 150 -8 C116 4 120 10 142 26 C108 8 108 14 122 44 C92 12 84 18 70 46 C58 12 44 12 0 0 Z"/>
  </defs>

  <!-- CIEL -->
  <rect width="856" height="540" fill="url(#vsSky)"/>

  <!-- Etoiles haut -->
  <g fill="#fff6ff">
    <circle cx="70" cy="40" r="2.2"/><circle cx="150" cy="70" r="1.5"/>
    <circle cx="300" cy="34" r="1.8"/><circle cx="430" cy="60" r="1.4"/>
    <circle cx="640" cy="40" r="2"/><circle cx="760" cy="70" r="1.6"/>
    <circle cx="820" cy="120" r="1.4"/><circle cx="500" cy="26" r="1.3"/>
    <circle cx="210" cy="30" r="1.3"/><circle cx="700" cy="100" r="1.4"/>
  </g>
  <g fill="#2de2e6" opacity="0.7">
    <circle cx="110" cy="100" r="1.4"/><circle cx="380" cy="90" r="1.3"/>
    <circle cx="590" cy="80" r="1.3"/><circle cx="790" cy="40" r="1.6"/>
  </g>

  <!-- HALO + SOLEIL RETRO a bandes -->
  <circle cx="560" cy="240" r="200" fill="url(#vsHalo)"/>
  <g>
    <circle cx="560" cy="240" r="128" fill="url(#vsSun)"/>
    <g clip-path="url(#vsSunClip)">
      <!-- bandes horizontales qui s'espacent vers le bas -->
      <rect x="432" y="252" width="256" height="9" fill="#12042a" opacity="0.55"/>
      <rect x="432" y="270" width="256" height="12" fill="#12042a" opacity="0.6"/>
      <rect x="432" y="292" width="256" height="15" fill="#12042a" opacity="0.65"/>
      <rect x="432" y="318" width="256" height="19" fill="#12042a" opacity="0.7"/>
      <rect x="432" y="348" width="256" height="24" fill="#12042a" opacity="0.72"/>
    </g>
    <circle cx="560" cy="240" r="128" fill="none" stroke="#fff6ff" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Montagnes lointaines -->
  <path d="M0 372 L120 330 L210 366 L340 322 L470 372 L560 330 L700 372 L856 336 L856 400 L0 400 Z"
        fill="#5a1a6e" opacity="0.55"/>

  <!-- SOL synthwave -->
  <rect x="0" y="384" width="856" height="156" fill="url(#vsFloor)"/>
  <!-- Horizon glow -->
  <rect x="0" y="380" width="856" height="8" fill="#ff2d95"/>
  <rect x="0" y="376" width="856" height="16" fill="#ff2d95" opacity="0.35" filter="url(#vsGlowBig)"/>

  <!-- Grille perspective (lignes verticales convergentes) -->
  <g stroke="#2de2e6" stroke-width="1.6" opacity="0.8">
    <line x1="428" y1="384" x2="428" y2="540"/>
    <line x1="428" y1="384" x2="330" y2="540"/>
    <line x1="428" y1="384" x2="180" y2="540"/>
    <line x1="428" y1="384" x2="-40" y2="540"/>
    <line x1="428" y1="384" x2="540" y2="540"/>
    <line x1="428" y1="384" x2="700" y2="540"/>
    <line x1="428" y1="384" x2="920" y2="540"/>
  </g>
  <!-- lignes horizontales du sol (plus serrees en haut) -->
  <g stroke="#ff2d95" stroke-width="1.6" opacity="0.85">
    <line x1="0" y1="396" x2="856" y2="396"/>
    <line x1="0" y1="412" x2="856" y2="412"/>
    <line x1="0" y1="434" x2="856" y2="434"/>
    <line x1="0" y1="462" x2="856" y2="462"/>
    <line x1="0" y1="498" x2="856" y2="498"/>
    <line x1="0" y1="540" x2="856" y2="540"/>
  </g>

  <!-- PALMIER NEON (droite) -->
  <g>
    <path d="M742 386 C736 320 748 250 770 176 L784 178 C766 252 758 322 762 386 Z" fill="url(#vsTrunk)"/>
    <g stroke="#0b2b32" stroke-width="2.5" opacity="0.6">
      <line x1="744" y1="360" x2="760" y2="360"/>
      <line x1="746" y1="336" x2="762" y2="336"/>
      <line x1="750" y1="308" x2="766" y2="308"/>
      <line x1="754" y1="278" x2="770" y2="278"/>
      <line x1="758" y1="248" x2="774" y2="248"/>
      <line x1="762" y1="216" x2="778" y2="216"/>
    </g>
    <!-- couronne de feuilles neon -->
    <g transform="translate(778,176)" fill="#2de2e6">
      <use href="#vsFrond" transform="rotate(-18) scale(1)"/>
      <use href="#vsFrond" transform="rotate(30) scale(0.92)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(18)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(-30) scale(0.92)"/>
      <use href="#vsFrond" transform="rotate(-70) scale(0.8)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(-70) scale(0.8)"/>
    </g>
    <g transform="translate(778,176)" fill="none" stroke="#eafcff" stroke-width="1.2" opacity="0.55">
      <use href="#vsFrond" transform="rotate(-18) scale(1)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(18)"/>
    </g>
    <circle cx="778" cy="176" r="9" fill="#eafcff"/>
  </g>

  <!-- FLAMANT ROSE (au premier plan, centre-droit) -->
  <g filter="url(#vsGlow)" opacity="0.5">
    <path d="M430 470 C426 430 434 400 452 372 C470 344 484 330 476 314 C470 300 452 302 442 312"
          fill="none" stroke="#ff4d9e" stroke-width="14"/>
  </g>
  <g>
    <!-- pattes -->
    <g stroke="#ff8a3d" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M436 472 L432 500 L420 512"/>
      <path d="M456 472 L462 502 L476 512"/>
    </g>
    <!-- corps -->
    <path d="M410 452 C400 430 406 408 428 400 C452 391 480 398 494 416 C504 428 500 446 486 456 C466 470 428 476 410 452 Z"
          fill="url(#vsFlamingo)"/>
    <!-- aile -->
    <path d="M444 410 C466 404 484 410 492 424 C480 428 460 430 444 424 Z" fill="#ffb3d9" opacity="0.85"/>
    <!-- cou en S -->
    <path d="M430 404 C440 372 452 350 448 326 C446 308 436 300 448 288 C458 278 474 280 482 292"
          fill="none" stroke="url(#vsFlamingo)" stroke-width="15" stroke-linecap="round"/>
    <!-- tete -->
    <circle cx="480" cy="292" r="13" fill="#ff5aa6"/>
    <circle cx="484" cy="288" r="2.6" fill="#12042a"/>
    <!-- bec -->
    <path d="M492 290 L512 300 L510 308 L490 300 Z" fill="#ff8a3d"/>
    <path d="M500 302 L512 300 L510 308 Z" fill="#12042a"/>
  </g>

  <!-- Petit palmier gauche (petit, pour equilibre, hors fenetre puce) -->
  <g opacity="0.9">
    <path d="M330 386 C328 350 334 316 344 280 L352 281 C342 318 338 352 340 386 Z" fill="url(#vsTrunk)"/>
    <g transform="translate(348,280) scale(0.62)" fill="#2de2e6">
      <use href="#vsFrond" transform="rotate(-16)"/>
      <use href="#vsFrond" transform="rotate(28) scale(0.9)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(16)"/>
      <use href="#vsFrond" transform="scale(-1,1) rotate(-28) scale(0.9)"/>
    </g>
    <circle cx="348" cy="280" r="6" fill="#eafcff"/>
  </g>

  <!-- Reflet du soleil sur le sol (bas) -->
  <g opacity="0.5">
    <rect x="520" y="386" width="80" height="150" fill="#ff8a3d" opacity="0.25" filter="url(#vsGlowBig)"/>
  </g>

  <!-- Cadre neon fin -->
  <rect x="6" y="6" width="844" height="528" fill="none" stroke="#2de2e6" stroke-width="2.5" opacity="0.6"/>
  <rect x="10" y="10" width="836" height="520" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.5"/>
</svg>
