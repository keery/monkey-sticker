    <use href="#ray" transform="rotate(30 505 250)"/>
    <use href="#ray" transform="rotate(60 505 250)"/>
    <use href="#ray" transform="rotate(90 505 250)"/>
    <use href="#ray" transform="rotate(120 505 250)"/>
    <use href="#ray" transform="rotate(150 505 250)"/>
    <use href="#ray" transform="rotate(180 505 250)"/>
    <use href="#ray" transform="rotate(210 505 250)"/>
    <use href="#ray" transform="rotate(240 505 250)"/>
    <use href="#ray" transform="rotate(270 505 250)"/>
    <use href="#ray" transform="rotate(300 505 250)"/>
    <use href="#ray" transform="rotate(330 505 250)"/>
  </g>
  <g fill="#d4af37" fill-opacity="0.24">
