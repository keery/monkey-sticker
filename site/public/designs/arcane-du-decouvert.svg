    <circle cx="530" cy="508" r="1.6"/>
    <circle cx="636" cy="516" r="1.8"/>
    <circle cx="712" cy="532" r="1.5"/>
  </g>

  <!-- ===== CONSTELLATION (droite) ===== -->
  <g>
    <polyline points="790,182 806,226 781,266 800,310" fill="none" stroke="#d4af37" stroke-width="0.9" opacity="0.5"/>
    <circle cx="790" cy="182" r="2.4" fill="#e9c85e"/>
    <circle cx="806" cy="226" r="1.9" fill="#e9c85e"/>
    <circle cx="781" cy="266" r="2.4" fill="#e9c85e"/>
    <circle cx="800" cy="310" r="1.9" fill="#e9c85e"/>
  </g>

  <!-- sparkles d'ambiance -->
  <use href="#spark" transform="translate(305,205) scale(0.5)" fill="#e9c85e" opacity="0.8"/>
  <use href="#spark" transform="translate(648,180) scale(0.6)" fill="#e9c85e" opacity="0.85"/>
  <use href="#spark" transform="translate(672,392) scale(0.5)" fill="#e9c85e" opacity="0.75"/>
  <use href="#spark" transform="translate(560,124) scale(0.4)" fill="#e9c85e" opacity="0.7"/>
  <use href="#spark" transform="translate(760,436) scale(0.45)" fill="#e9c85e" opacity="0.7"/>
  <use href="#spark" transform="translate(262,270) scale(0.38)" fill="#e9c85e" opacity="0.6"/>

  <!-- ===== CARTOUCHE TITRE BAS ===== -->
  <g>
    <path d="M268,450 L234,471 L268,492 Z" fill="#0b1330" stroke="#d4af37" stroke-width="1.5"/>
    <path d="M588,450 L622,471 L588,492 Z" fill="#0b1330" stroke="#d4af37" stroke-width="1.5"/>
    <rect x="268" y="446" width="320" height="50" fill="#0d1633" stroke="#d4af37" stroke-width="2"/>
    <rect x="274" y="452" width="308" height="38" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
    <rect x="289" y="468" width="7" height="7" transform="rotate(45 292.5 471.5)" fill="#d4af37"/>
    <rect x="560" y="468" width="7" height="7" transform="rotate(45 563.5 471.5)" fill="#d4af37"/>
    <text x="428" y="479" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="bold" letter-spacing="3.5" fill="url(#goldText)">LE DÉCOUVERT</text>
    <line x1="168" y1="471" x2="228" y2="471" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    <circle cx="162" cy="471" r="2.5" fill="#d4af37" opacity="0.8"/>
    <line x1="628" y1="471" x2="688" y2="471" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    <circle cx="694" cy="471" r="2.5" fill="#d4af37" opacity="0.8"/>
  </g>
</svg>
