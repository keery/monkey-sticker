  <g>
    <path d="M414,318 q -10,16 -6,30" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>
    <path d="M368,356 q -10,16 -7,28" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45"/>
    <path d="M318,394 q -10,14 -8,26" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
