    <path d="M-80,-25 h28 M-66,-36 v22" fill="none" stroke="#8a6d1f" stroke-width="0.8"/>
    <!-- ondes sans contact -->
    <path d="M-42,-32 a11,11 0 0 1 0,16 M-38,-28 a5.5,5.5 0 0 1 0,8" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
