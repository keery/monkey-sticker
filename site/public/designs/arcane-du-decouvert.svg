    <use href="#ray2" transform="rotate(75 505 250)"/>
    <use href="#ray2" transform="rotate(105 505 250)"/>
    <use href="#ray2" transform="rotate(135 505 250)"/>
    <use href="#ray2" transform="rotate(165 505 250)"/>
    <use href="#ray2" transform="rotate(195 505 250)"/>
    <use href="#ray2" transform="rotate(225 505 250)"/>
    <use href="#ray2" transform="rotate(255 505 250)"/>
    <use href="#ray2" transform="rotate(285 505 250)"/>
    <use href="#ray2" transform="rotate(315 505 250)"/>
