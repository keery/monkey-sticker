    <path d="M133,96 q 5,6 11,0" fill="none" stroke="#101b3d" stroke-width="2" stroke-linecap="round"/>
    <path d="M134,116 q 4,4 9,1" fill="none" stroke="#101b3d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="128" cy="107" r="2.4" fill="#c96f4a" opacity="0.55"/>
    <circle cx="196" cy="70" r="1.6" fill="#f4e2a0" opacity="0.7"/>
    <circle cx="105" cy="60" r="1.4" fill="#f4e2a0" opacity="0.6"/>
