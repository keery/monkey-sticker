    <g transform="translate(20,-2)">
      <path d="M-33,0 Q0,-25 33,0 Q0,25 -33,0 Z" fill="#f5e9cf" stroke="#d4af37" stroke-width="1.5"/>
      <circle r="11.5" fill="#16244f" stroke="#d4af37" stroke-width="1"/>
      <circle r="4.6" fill="#d4af37"/>
      <circle cx="3.5" cy="-4" r="1.8" fill="#f5e9cf"/>
      <g stroke="#d4af37" stroke-width="1.5" stroke-linecap="round">
        <path d="M0,-27 L0,-35"/>
        <path d="M19,-19 L25,-26"/>
        <path d="M-19,-19 L-25,-26"/>
        <path d="M31,-7 L40,-11"/>
        <path d="M-31,-7 L-40,-11"/>
      </g>
      <path d="M-10,15 C-6,21 -5,26 -10,29 C-15,26 -14,21 -10,15 Z" fill="#8fa3d9"/>
    </g>
    <!-- numero en pointilles -->
    <g fill="#d4af37" opacity="0.85">
      <circle cx="-76" cy="44" r="2"/><circle cx="-67" cy="44" r="2"/><circle cx="-58" cy="44" r="2"/><circle cx="-49" cy="44" r="2"/>
      <circle cx="-34" cy="44" r="2"/><circle cx="-25" cy="44" r="2"/><circle cx="-16" cy="44" r="2"/><circle cx="-7" cy="44" r="2"/>
      <circle cx="8" cy="44" r="2"/><circle cx="17" cy="44" r="2"/><circle cx="26" cy="44" r="2"/><circle cx="35" cy="44" r="2"/>
      <circle cx="50" cy="44" r="2"/><circle cx="59" cy="44" r="2"/><circle cx="68" cy="44" r="2"/><circle cx="77" cy="44" r="2"/>
    </g>
  </g>

  <!-- ===== MANCHE + MAIN sortant des nuages ===== -->
  <path d="M492,540 C495,472 514,416 540,378 L594,392 C586,432 590,482 602,540 Z" fill="#34477e" stroke="#d4af37" stroke-width="1.5"/>
  <path d="M540,378 L594,392 L588,414 C568,404 552,400 533,400 Z" fill="#d4af37"/>
  <ellipse cx="553" cy="348" rx="34" ry="28" transform="rotate(-12 553 348)" fill="#f2e3c0" stroke="#0d1633" stroke-width="2"/>
  <rect x="516" y="288" width="17" height="54" rx="8.5" transform="rotate(-14 524 315)" fill="#f2e3c0" stroke="#0d1633" stroke-width="2"/>
  <rect x="537" y="284" width="17" height="56" rx="8.5" transform="rotate(-10 545 312)" fill="#f2e3c0" stroke="#0d1633" stroke-width="2"/>
  <rect x="558" y="282" width="17" height="54" rx="8.5" transform="rotate(-6 566 309)" fill="#f2e3c0" stroke="#0d1633" stroke-width="2"/>
  <rect x="584" y="298" width="18" height="48" rx="9" transform="rotate(28 593 322)" fill="#f2e3c0" stroke="#0d1633" stroke-width="2"/>

  <!-- ===== NUAGES bas (recouvrent la manche) ===== -->
  <g fill="#1b2a52">
    <circle cx="350" cy="560" r="70"/>
    <circle cx="450" cy="555" r="80"/>
    <circle cx="560" cy="560" r="85"/>
    <circle cx="660" cy="555" r="70"/>
    <circle cx="745" cy="572" r="60"/>
  </g>
  <g fill="#2a3c70">
    <circle cx="400" cy="566" r="55"/>
    <circle cx="500" cy="562" r="65"/>
    <circle cx="602" cy="566" r="60"/>
    <circle cx="692" cy="576" r="50"/>
  </g>
  <g fill="#d4af37" opacity="0.5">
