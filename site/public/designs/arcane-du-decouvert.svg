      <use href="#sunray" transform="rotate(90 712 106)"/>
      <use href="#sunray" transform="rotate(135 712 106)"/>
      <use href="#sunray" transform="rotate(180 712 106)"/>
      <use href="#sunray" transform="rotate(225 712 106)"/>
      <use href="#sunray" transform="rotate(270 712 106)"/>
      <use href="#sunray" transform="rotate(315 712 106)"/>
    </g>
    <g fill="#d4af37" opacity="0.6">
      <use href="#sunray" transform="rotate(22.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(67.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(112.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(157.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(202.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(247.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(292.5 712 106) translate(0,14) scale(1,0.75)"/>
      <use href="#sunray" transform="rotate(337.5 712 106) translate(0,14) scale(1,0.75)"/>
