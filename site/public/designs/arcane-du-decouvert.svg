  <!-- ===== PETIT TAS DE PIECES ENVOLEES (bas gauche) ===== -->
  <g>
    <ellipse cx="155" cy="462" rx="27" ry="9" fill="url(#coinGrad)" stroke="#7a5f1c" stroke-width="1.4"/>
    <ellipse cx="161" cy="449" rx="27" ry="9" fill="url(#coinGrad)" stroke="#7a5f1c" stroke-width="1.4"/>
    <ellipse cx="152" cy="436" rx="27" ry="9" fill="url(#coinGrad)" stroke="#7a5f1c" stroke-width="1.4"/>
    <ellipse cx="152" cy="433.5" rx="27" ry="9" fill="#f0d98c" stroke="#7a5f1c" stroke-width="1"/>
