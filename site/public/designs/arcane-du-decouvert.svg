  <text x="428" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" letter-spacing="8" fill="url(#goldText)">XXII</text>
  <text x="428" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="6" fill="#d4af37" opacity="0.8">ARCANE MAJEUR</text>
  <use href="#spark" transform="translate(340,72) scale(0.65)" fill="#e9c85e" opacity="0.9"/>
  <use href="#spark" transform="translate(516,72) scale(0.65)" fill="#e9c85e" opacity="0.9"/>

