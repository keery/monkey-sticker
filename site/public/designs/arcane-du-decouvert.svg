<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="L'Arcane du Decouvert - carte de tarot XXII Le Decouvert">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a2a5c"/>
      <stop offset="55%" stop-color="#101b3d"/>
      <stop offset="100%" stop-color="#0a1129"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e2a0"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8912a"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26386f"/>
      <stop offset="100%" stop-color="#0e1836"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f4e2a0"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b08a24"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d98c"/>
      <stop offset="100%" stop-color="#c49b2c"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.5" fill="#d4af37" opacity="0.13"/>
      <circle cx="24" cy="24" r="1.1" fill="#d4af37" opacity="0.09"/>
    </pattern>
    <path id="spark" d="M0,-11 C1.2,-3.5 3.5,-1.2 11,0 C3.5,1.2 1.2,3.5 0,11 C-1.2,3.5 -3.5,1.2 -11,0 C-3.5,-1.2 -1.2,-3.5 0,-11 Z"/>
    <path id="ray" d="M505,104 L513,212 L497,212 Z"/>
    <path id="ray2" d="M505,134 L511,216 L499,216 Z"/>
    <path id="sunray" d="M712,46 L719,78 L705,78 Z"/>
    <g id="cornerOrn" fill="none" stroke="#d4af37">
      <path d="M0,30 Q0,0 30,0" stroke-width="1.6"/>
      <path d="M6,34 Q6,6 34,6" stroke-width="0.9" opacity="0.6"/>
      <circle cx="15" cy="15" r="2.4" fill="#d4af37" stroke="none"/>
      <circle cx="27" cy="12" r="1.4" fill="#d4af37" stroke="none" opacity="0.8"/>
      <circle cx="12" cy="27" r="1.4" fill="#d4af37" stroke="none" opacity="0.8"/>
    </g>
    <mask id="moonMask">
      <rect x="90" y="40" width="130" height="130" fill="#ffffff"/>
      <circle cx="174" cy="92" r="31" fill="#000000"/>
    </mask>
  </defs>

  <!-- ===== FOND ===== -->
  <rect x="0" y="0" width="856" height="540" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="856" height="540" fill="url(#dots)"/>

  <!-- petites etoiles de fond (hors fenetre puce) -->
  <g fill="#f4e2a0">
    <circle cx="300" cy="142" r="1.6" opacity="0.5"/>
    <circle cx="365" cy="95" r="1.2" opacity="0.4"/>
    <circle cx="620" cy="150" r="1.5" opacity="0.5"/>
    <circle cx="770" cy="360" r="1.4" opacity="0.45"/>
    <circle cx="255" cy="330" r="1.3" opacity="0.4"/>
    <circle cx="700" cy="255" r="1.4" opacity="0.4"/>
    <circle cx="330" cy="430" r="1.3" opacity="0.35"/>
    <circle cx="248" cy="112" r="1.4" opacity="0.45"/>
  </g>

  <!-- ===== CADRE GRAVE ===== -->
  <rect x="16" y="16" width="824" height="508" fill="none" stroke="#d4af37" stroke-width="3"/>
  <rect x="23" y="23" width="810" height="494" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-dasharray="1 6" opacity="0.55"/>
  <rect x="30" y="30" width="796" height="480" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
  <use href="#cornerOrn" transform="translate(44,44)"/>
  <use href="#cornerOrn" transform="translate(812,44) scale(-1,1)"/>
  <use href="#cornerOrn" transform="translate(44,496) scale(1,-1)"/>
  <use href="#cornerOrn" transform="translate(812,496) scale(-1,-1)"/>

