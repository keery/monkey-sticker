    <path d="M716,103 q 4,5 9,0" fill="none" stroke="#101b3d" stroke-width="2" stroke-linecap="round"/>
    <path d="M706,114 q 6,6 13,0" fill="none" stroke="#101b3d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="698" cy="111" r="2.5" fill="#c96f4a" opacity="0.5"/>
    <circle cx="727" cy="111" r="2.5" fill="#c96f4a" opacity="0.5"/>
