<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540">
  <title>Sans contact, sans argent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="0.55" stop-color="#f5f1e6"/>
      <stop offset="1" stop-color="#eae1c9"/>
    </linearGradient>
    <radialGradient id="glowR">
      <stop offset="0" stop-color="#e0472f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e0472f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO">
      <stop offset="0" stop-color="#d9a03f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d9a03f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond gradient crème -->
  <rect width="856" height="540" fill="url(#bg)"/>
  <circle cx="790" cy="120" r="210" fill="url(#glowR)"/>
  <circle cx="440" cy="300" r="260" fill="url(#glowO)"/>
  <circle cx="120" cy="470" r="170" fill="url(#glowR)"/>

  <!-- Cadre pointillé autour de la fenêtre puce (zone découpée, rien d'important dedans) -->
  <rect x="60" y="150" width="180" height="180" rx="16" fill="none" stroke="#191919" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.45"/>
  <text x="150" y="350" text-anchor="middle" font-family="'Courier New',monospace" font-size="12.5" font-weight="bold" letter-spacing="2" fill="#191919" opacity="0.6">NE PAS GRATTER</text>

  <!-- Typographie poster avec ombre décalée rouge -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="76" lengthAdjust="spacingAndGlyphs">
    <text x="73" y="131" textLength="700" fill="#e0472f">SANS CONTACT,</text>
    <text x="68" y="126" textLength="700" fill="#191919">SANS CONTACT,</text>
    <text x="73" y="451" textLength="700" fill="#e0472f">SANS ARGENT.</text>
    <text x="68" y="446" textLength="700" fill="#191919">SANS ARGENT.</text>
  </g>

  <!-- Scène : portefeuille béant et vide -->
  <ellipse cx="430" cy="324" rx="115" ry="10" fill="#191919" opacity="0.1"/>
  <!-- Intérieur sombre -->
  <path d="M516,272 L340,272 L354,193 Z" fill="#191919"/>
  <!-- Rabat supérieur ouvert -->
  <g transform="rotate(26 516 270)">
    <rect x="336" y="222" width="180" height="48" rx="12" fill="#e4b45c" stroke="#191919" stroke-width="5"/>
    <line x1="352" y1="240" x2="500" y2="240" stroke="#f5f1e6" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Mâchoire inférieure -->
  <rect x="336" y="270" width="180" height="48" rx="12" fill="#d9a03f" stroke="#191919" stroke-width="5"/>
  <rect x="341" y="273" width="170" height="9" rx="4.5" fill="#b07f2e" opacity="0.9"/>
  <line x1="352" y1="302" x2="500" y2="302" stroke="#f5f1e6" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.9"/>

  <!-- Mite qui s'envole du portefeuille, trajectoire pointillée -->
  <path d="M378,228 C338,212 326,178 356,160 C378,148 420,146 444,158" fill="none" stroke="#191919" stroke-width="2.4" stroke-dasharray="0.1 7" stroke-linecap="round" opacity="0.65"/>
  <g fill="#191919">
    <ellipse cx="449" cy="157" rx="6" ry="10" transform="rotate(-28 449 157)"/>
    <ellipse cx="463" cy="157" rx="6" ry="10" transform="rotate(28 463 157)"/>
    <ellipse cx="456" cy="164" rx="3.2" ry="7.5"/>
  </g>
  <path d="M454,157 q-3,-6 -7,-8 M458,157 q3,-6 7,-8" fill="none" stroke="#191919" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Poussière / étincelles de vide -->
  <path d="M395,169 v12 M389,175 h12" stroke="#191919" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="516" cy="196" r="2.5" fill="#191919" opacity="0.55"/>
  <path d="M527,166 v9 M522.5,170.5 h9" stroke="#191919" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Ondes sans contact émises par le portefeuille -->
  <circle cx="563" cy="244" r="5" fill="#e0472f"/>
  <g fill="none" stroke="#e0472f" stroke-width="7" stroke-linecap="round">
    <path d="M581,223 A30 30 0 0 1 581,265"/>
    <path d="M598,206 A54 54 0 0 1 598,282"/>
    <path d="M615,189 A78 78 0 0 1 615,299"/>
  </g>

  <!-- Dernière pièce : zéro euro -->
  <ellipse cx="648" cy="320" rx="16" ry="3.5" fill="#191919" opacity="0.12"/>
  <circle cx="648" cy="304" r="16" fill="#d9a03f" stroke="#191919" stroke-width="4"/>
  <circle cx="648" cy="304" r="10" fill="none" stroke="#191919" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="648" y="310" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="15" fill="#191919">0</text>

  <!-- Tampon REFUSÉ -->
  <g transform="rotate(-12 770 240)" opacity="0.92">
    <rect x="695" y="214" width="150" height="52" rx="9" fill="none" stroke="#e0472f" stroke-width="4"/>
    <rect x="704" y="223" width="132" height="34" rx="5" fill="none" stroke="#e0472f" stroke-width="2"/>
    <text x="770" y="249" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="26" letter-spacing="2" textLength="112" lengthAdjust="spacingAndGlyphs" fill="#e0472f">REFUSÉ</text>
  </g>

  <!-- Pastille solde -->
  <rect x="605" y="461" width="200" height="44" rx="22" fill="#e0472f"/>
  <rect x="600" y="456" width="200" height="44" rx="22" fill="#191919"/>
  <text x="700" y="484" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="20" fill="#f5f1e6">SOLDE : 0,00 €</text>

  <!-- Mention édition -->
  <text x="68" y="502" font-family="'Courier New',monospace" font-weight="bold" font-size="13" letter-spacing="2" fill="#191919" opacity="0.55">• ÉDITION POUVOIR D'ACHAT •</text>
</svg>
