<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540" role="img" aria-label="Zodiaque Celeste Or">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0C1330"/>
      <stop offset="0.55" stop-color="#131B40"/>
      <stop offset="1" stop-color="#0A1029"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2B3670"/>
      <stop offset="0.6" stop-color="#1B2450"/>
      <stop offset="1" stop-color="#0C1330" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E1A0"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A9842A"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CF7E"/>
      <stop offset="1" stop-color="#C6A032"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4E1A0"/>
      <stop offset="0.35" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B2450" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#1B2450" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep night sky -->
  <rect x="0" y="0" width="856" height="540" fill="url(#sky)"/>
  <ellipse cx="600" cy="255" rx="330" ry="300" fill="url(#glow)" opacity="0.9"/>

  <!-- Faint dotted star field (ambiance: dots), avoids chip window 70-230 / 160-320 -->
  <g fill="#D4AF37">
    <circle cx="60" cy="70" r="1.6" opacity="0.55"/>
    <circle cx="120" cy="48" r="1.1" opacity="0.4"/>
    <circle cx="188" cy="96" r="1.8" opacity="0.6"/>
    <circle cx="250" cy="60" r="1.2" opacity="0.45"/>
    <circle cx="312" cy="40" r="1.7" opacity="0.55"/>
    <circle cx="360" cy="90" r="1.1" opacity="0.4"/>
    <circle cx="410" cy="52" r="1.5" opacity="0.5"/>
    <circle cx="470" cy="78" r="1.2" opacity="0.45"/>
    <circle cx="520" cy="44" r="1.9" opacity="0.6"/>
    <circle cx="580" cy="96" r="1.1" opacity="0.4"/>
    <circle cx="640" cy="58" r="1.6" opacity="0.55"/>
    <circle cx="700" cy="86" r="1.2" opacity="0.45"/>
    <circle cx="756" cy="46" r="1.8" opacity="0.6"/>
    <circle cx="808" cy="92" r="1.3" opacity="0.45"/>
    <circle cx="836" cy="150" r="1.6" opacity="0.5"/>
    <circle cx="792" cy="200" r="1.1" opacity="0.4"/>
    <circle cx="820" cy="270" r="1.7" opacity="0.55"/>
    <circle cx="806" cy="340" r="1.2" opacity="0.45"/>
    <circle cx="838" cy="410" r="1.5" opacity="0.5"/>
    <circle cx="800" cy="470" r="1.2" opacity="0.4"/>
    <circle cx="748" cy="500" r="1.8" opacity="0.55"/>
    <circle cx="690" cy="470" r="1.1" opacity="0.4"/>
    <circle cx="636" cy="504" r="1.5" opacity="0.5"/>
    <circle cx="580" cy="474" r="1.2" opacity="0.45"/>
    <circle cx="520" cy="506" r="1.7" opacity="0.55"/>
    <circle cx="460" cy="472" r="1.1" opacity="0.4"/>
    <circle cx="400" cy="502" r="1.6" opacity="0.5"/>
    <circle cx="342" cy="470" r="1.2" opacity="0.45"/>
    <circle cx="284" cy="504" r="1.5" opacity="0.5"/>
    <circle cx="226" cy="474" r="1.2" opacity="0.4"/>
    <circle cx="150" cy="470" r="1.7" opacity="0.5"/>
    <circle cx="80" cy="500" r="1.2" opacity="0.4"/>
    <circle cx="40" cy="430" r="1.5" opacity="0.5"/>
    <circle cx="48" cy="360" r="1.1" opacity="0.4"/>
    <circle cx="700" cy="150" r="1.2" opacity="0.4"/>
    <circle cx="760" cy="240" r="1.4" opacity="0.45"/>
    <circle cx="668" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="726" cy="330" r="1.3" opacity="0.45"/>
    <circle cx="330" cy="150" r="1.1" opacity="0.4"/>
    <circle cx="288" cy="120" r="1.3" opacity="0.4"/>
    <circle cx="392" cy="130" r="1.2" opacity="0.4"/>
  </g>

  <!-- ===== Zodiac medallion (Scorpio constellation) ===== -->
  <g transform="translate(600 270)">
    <!-- outer glow ring -->
    <circle cx="0" cy="0" r="182" fill="url(#ringGlow)"/>
    <!-- decorative concentric rings -->
    <circle cx="0" cy="0" r="176" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="166" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.55"/>
    <!-- dotted tick ring (dots ambiance) -->
    <g fill="#D4AF37">
      <circle cx="0" cy="-160" r="2.1"/><circle cx="55" cy="-150" r="2.1"/><circle cx="102" cy="-123" r="2.1"/>
      <circle cx="139" cy="-80" r="2.1"/><circle cx="158" cy="-27" r="2.1"/><circle cx="158" cy="27" r="2.1"/>
      <circle cx="139" cy="80" r="2.1"/><circle cx="102" cy="123" r="2.1"/><circle cx="55" cy="150" r="2.1"/>
      <circle cx="0" cy="160" r="2.1"/><circle cx="-55" cy="150" r="2.1"/><circle cx="-102" cy="123" r="2.1"/>
      <circle cx="-139" cy="80" r="2.1"/><circle cx="-158" cy="27" r="2.1"/><circle cx="-158" cy="-27" r="2.1"/>
      <circle cx="-139" cy="-80" r="2.1"/><circle cx="-102" cy="-123" r="2.1"/><circle cx="-55" cy="-150" r="2.1"/>
    </g>

    <!-- inner disc -->
    <circle cx="0" cy="0" r="150" fill="#0C1330"/>
    <circle cx="0" cy="0" r="150" fill="url(#glow)" opacity="0.6"/>

    <!-- Constellation lines (Scorpius silhouette) -->
    <g stroke="url(#goldSoft)" stroke-width="1.8" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-96 -92 L-58 -70 L-18 -60 L26 -48 L36 -8 L20 34 L48 66 L86 88 L102 58 L82 24"/>
    </g>

    <!-- Constellation stars -->
    <g>
      <g fill="url(#starGlow)">
        <circle cx="-96" cy="-92" r="9"/><circle cx="-18" cy="-60" r="9"/>
        <circle cx="36" cy="-8" r="10"/><circle cx="48" cy="66" r="9"/><circle cx="102" cy="58" r="8"/>
      </g>
      <g fill="url(#gold)">
        <circle cx="-96" cy="-92" r="3.2"/><circle cx="-58" cy="-70" r="2.6"/><circle cx="-18" cy="-60" r="3.2"/>
        <circle cx="26" cy="-48" r="2.6"/><circle cx="36" cy="-8" r="3.6"/><circle cx="20" cy="34" r="2.6"/>
        <circle cx="48" cy="66" r="3.2"/><circle cx="86" cy="88" r="2.6"/><circle cx="102" cy="58" r="3"/><circle cx="82" cy="24" r="2.6"/>
      </g>
      <!-- twinkle four-point on hero star -->
      <path d="M36 -8 L39 -26 L42 -8 L60 -5 L42 -2 L39 16 L36 -2 L18 -5 Z" fill="url(#gold)" opacity="0.85"/>
    </g>
  </g>

  <!-- ===== Zodiac glyph badge (Scorpio) — left/upper, clear of chip window ===== -->
  <g transform="translate(330 360)">
    <circle cx="0" cy="0" r="58" fill="#0C1330" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.5"/>
    <!-- Scorpio glyph (m with barbed tail) -->
    <g fill="none" stroke="url(#gold)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 -18 L-30 20 M-30 -14 Q-24 -20 -18 -14 L-18 20 M-18 -14 Q-12 -20 -6 -14 L-6 20 L4 30"/>
      <path d="M4 30 L20 30"/>
    </g>
    <path d="M15 22 L27 32 L17 34 L23 24 Z" fill="url(#gold)"/>
  </g>

  <!-- ===== Title lockup — top-right, premium & legible ===== -->
  <g transform="translate(490 92)">
    <g fill="#D4AF37"><circle cx="-6" cy="-4" r="1.8"/><circle cx="150" cy="-4" r="1.8"/></g>
    <text x="72" y="4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="7" fill="url(#gold)">ZODIAQUE</text>
    <text x="72" y="34" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" letter-spacing="12" fill="#E9CF7E">CÉLESTE</text>
    <line x1="0" y1="48" x2="144" y2="48" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Shooting star accent (upper area, clear of chip window) -->
  <g stroke="url(#gold)" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <line x1="300" y1="200" x2="360" y2="176"/>
  </g>
  <circle cx="360" cy="176" r="2.6" fill="url(#starGlow)"/>

  <!-- Thin gold inner frame -->
  <rect x="14" y="14" width="828" height="512" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.35"/>
</svg>
