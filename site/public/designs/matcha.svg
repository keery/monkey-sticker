<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540">
  <defs>
    <!-- Fond : dégradé matcha crémeux, tonal, apaisant -->
    <linearGradient id="mtBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#e8efd6"/>
      <stop offset="34%" stop-color="#d3e0af"/>
      <stop offset="66%" stop-color="#a9c37e"/>
      <stop offset="100%" stop-color="#8ba861"/>
    </linearGradient>
    <!-- Voile de lumière diagonale -->
    <linearGradient id="mtSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Halo derrière le bol -->
    <radialGradient id="mtHalo" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f4f8e8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#eef4dd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#eef4dd" stop-opacity="0"/>
    </radialGradient>
    <!-- Céramique du bol (extérieur crème) -->
    <linearGradient id="mtBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdf5"/>
      <stop offset="52%" stop-color="#eef2e2"/>
      <stop offset="100%" stop-color="#d6ddc2"/>
    </linearGradient>
    <!-- Surface du matcha dans le bol -->
    <radialGradient id="mtSurface" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#a7c274"/>
      <stop offset="55%" stop-color="#8ba861"/>
      <stop offset="100%" stop-color="#6f8c49"/>
    </radialGradient>
    <!-- Mousse crémeuse -->
    <radialGradient id="mtFoam" cx="44%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f6f9ec"/>
      <stop offset="60%" stop-color="#dfe9c2"/>
      <stop offset="100%" stop-color="#c3d69b"/>
    </radialGradient>
    <!-- Latte dans le verre -->
    <linearGradient id="mtLatte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6ea"/>
      <stop offset="30%" stop-color="#e7eecf"/>
      <stop offset="46%" stop-color="#c8d99f"/>
      <stop offset="100%" stop-color="#9db96f"/>
    </linearGradient>
    <!-- Verre (paroi) -->
    <linearGradient id="mtGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.32"/>
    </linearGradient>
    <!-- Fouet bambou (chasen) -->
    <linearGradient id="mtWhisk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe0b8"/>
      <stop offset="100%" stop-color="#cbb37e"/>
    </linearGradient>
    <filter id="mtSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="mtSoftSm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- Feuille de thé stylisée -->
    <path id="mtLeaf" d="M0 0 C22 -6 46 2 58 22 C40 26 16 20 0 0 Z"/>
  </defs>

  <!-- FOND dégradé -->
  <rect width="856" height="540" fill="url(#mtBg)"/>
  <rect width="856" height="540" fill="url(#mtSheen)"/>

  <!-- Feuilles de thé flottantes, discrètes, côté gauche/haut (hors zone puce) -->
  <g fill="#7d9a52" opacity="0.30">
    <use href="#mtLeaf" transform="translate(300,70) rotate(-24) scale(0.9)"/>
    <use href="#mtLeaf" transform="translate(120,110) rotate(140) scale(0.7)"/>
    <use href="#mtLeaf" transform="translate(60,80) rotate(30) scale(0.55)"/>
    <use href="#mtLeaf" transform="translate(760,470) rotate(-150) scale(0.85)"/>
    <use href="#mtLeaf" transform="translate(300,500) rotate(20) scale(0.65)"/>
  </g>
  <g fill="#b7cd8a" opacity="0.4">
    <use href="#mtLeaf" transform="translate(690,90) rotate(-40) scale(0.75)"/>
    <use href="#mtLeaf" transform="translate(560,40) rotate(160) scale(0.5)"/>
    <use href="#mtLeaf" transform="translate(810,300) rotate(80) scale(0.6)"/>
  </g>

  <!-- HALO doux derrière la scène principale -->
  <ellipse cx="560" cy="300" rx="290" ry="250" fill="url(#mtHalo)"/>

  <!-- ================= LATTE (verre, arrière-gauche du groupe, décalé du chip) ================= -->
  <g>
    <!-- ombre -->
    <ellipse cx="430" cy="470" rx="72" ry="16" fill="#6f8c49" opacity="0.28" filter="url(#mtSoftSm)"/>
    <!-- corps du verre : latte -->
    <path d="M382 330 C382 322 388 316 396 316 L464 316 C472 316 478 322 478 330 L470 452 C469 462 461 470 451 470 L409 470 C399 470 391 462 390 452 Z"
          fill="url(#mtLatte)"/>
    <!-- mousse claire en haut du latte -->
    <path d="M382 330 C382 322 388 316 396 316 L464 316 C472 316 478 322 478 330 L476 356 C440 366 418 366 384 356 Z"
          fill="#f2f5e6"/>
    <!-- petit art latte : feuille verte -->
    <path d="M430 326 C424 334 424 346 430 352 C436 346 436 334 430 326 Z" fill="#9bb96b" opacity="0.85"/>
    <path d="M430 330 L430 350" stroke="#7d9a52" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- paroi verre : reflets -->
    <path d="M382 330 C382 322 388 316 396 316 L464 316 C472 316 478 322 478 330 L470 452 C469 462 461 470 451 470 L409 470 C399 470 391 462 390 452 Z"
          fill="url(#mtGlass)"/>
    <rect x="398" y="336" width="7" height="120" rx="3.5" fill="#ffffff" opacity="0.5"/>
    <rect x="412" y="340" width="4" height="108" rx="2" fill="#ffffff" opacity="0.3"/>
    <!-- liseré du verre -->
    <path d="M382 330 C382 322 388 316 396 316 L464 316 C472 316 478 322 478 330"
          fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <!-- paille -->
    <rect x="452" y="286" width="9" height="52" rx="4" fill="#b7cd8a" transform="rotate(12 456 312)"/>
    <rect x="452" y="286" width="3.5" height="52" rx="2" fill="#ffffff" opacity="0.5" transform="rotate(12 456 312)"/>
  </g>

  <!-- ================= BOL DE MATCHA (héros, centre-droit) ================= -->
  <g>
    <!-- ombre portée -->
    <ellipse cx="592" cy="452" rx="150" ry="30" fill="#6f8c49" opacity="0.3" filter="url(#mtSoft)"/>

    <!-- corps du bol -->
    <path d="M470 356 C470 356 496 452 592 452 C688 452 714 356 714 356 Z" fill="url(#mtBowl)"/>
    <!-- ombre interne du bol -->
    <path d="M470 356 C470 356 496 452 592 452 C688 452 714 356 714 356 Z" fill="#000000" opacity="0.05"/>

    <!-- ellipse d'ouverture (matcha) -->
    <ellipse cx="592" cy="356" rx="122" ry="34" fill="url(#mtSurface)"/>
    <!-- reflet doux sur le matcha -->
    <ellipse cx="560" cy="346" rx="60" ry="14" fill="#c3d69b" opacity="0.55"/>

    <!-- TOURBILLON DE MOUSSE minimaliste (spirale du fouet) -->
    <g fill="none" stroke="#eef4dd" stroke-width="3.4" stroke-linecap="round" opacity="0.92">
      <path d="M592 356 m0 0
               a10 3 0 1 1 0.1 0
               a26 8 0 1 1 0.2 0
               a44 13 0 1 1 0.3 0
               a62 18 0 1 1 0.4 0
               a82 24 0 1 0 0.5 0"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
      <path d="M592 353
               a18 5 0 1 1 0.2 0
               a38 11 0 1 1 0.3 0
               a58 17 0 1 1 0.4 0
               a78 22 0 1 0 0.5 0"/>
    </g>
    <!-- bulles de mousse -->
    <g fill="#f6f9ec" opacity="0.9">
      <circle cx="620" cy="352" r="2.6"/>
      <circle cx="568" cy="362" r="2"/>
      <circle cx="600" cy="366" r="1.6"/>
      <circle cx="640" cy="360" r="1.8"/>
      <circle cx="552" cy="352" r="1.5"/>
    </g>

    <!-- liseré de l'ouverture -->
    <ellipse cx="592" cy="356" rx="122" ry="34" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.65"/>
    <!-- reflet vertical sur la céramique -->
    <path d="M498 372 C512 416 546 442 574 448" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- ================= FOUET CHASEN (posé derrière, à droite) ================= -->
  <g transform="translate(700,300) rotate(18)">
    <!-- manche -->
    <rect x="-9" y="-96" width="18" height="96" rx="9" fill="url(#mtWhisk)"/>
    <rect x="-6" y="-92" width="4" height="88" rx="2" fill="#ffffff" opacity="0.4"/>
    <!-- brins -->
    <g stroke="#ded0a6" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M-8 0 C-14 22 -16 40 -14 58"/>
      <path d="M-4 0 C-7 24 -8 44 -6 62"/>
      <path d="M0 0 C0 24 0 46 0 64"/>
      <path d="M4 0 C7 24 8 44 6 62"/>
      <path d="M8 0 C14 22 16 40 14 58"/>
    </g>
  </g>

  <!-- ================= CUILLÈRE/TAMIS mini (petit accent bas-gauche du groupe) ================= -->
  <g transform="translate(505,430) rotate(-14)">
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="#eef2e2" stroke="#cbb37e" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="#8ba861" opacity="0.25"/>
    <rect x="24" y="-3" width="40" height="6" rx="3" fill="url(#mtWhisk)"/>
  </g>

  <!-- Vapeur douce montant du bol -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3">
    <path d="M560 322 C548 300 572 288 560 264 C550 244 570 232 560 210"/>
    <path d="M620 320 C632 300 610 288 622 266 C632 248 614 236 624 216"/>
  </g>

  <!-- Titre discret, bas -->
  <g opacity="0.9">
    <text x="428" y="512" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="30" letter-spacing="10" fill="#5f7a3e" font-weight="600">MATCHA</text>
  </g>

  <!-- Points décoratifs (rythme) -->
  <g fill="#7d9a52" opacity="0.5">
    <circle cx="360" cy="502" r="3"/>
    <circle cx="500" cy="502" r="3"/>
  </g>

  <!-- Cadre fin crème -->
  <rect x="8" y="8" width="840" height="524" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.45"/>
</svg>
