<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540">
  <title>Carte Rare Holo — cristal foil prismatique</title>
  <defs>
    <!-- Fond profond : encre nuit pour faire ressortir le foil -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a2e"/>
      <stop offset="0.5" stop-color="#1c1044"/>
      <stop offset="1" stop-color="#0c0722"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.64" cy="0.46" r="0.8">
      <stop offset="0" stop-color="#3a1f7a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#1c1044" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0c0722" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== APLATS FOIL FRANCS (pas de pastel translucide) ===== -->
    <linearGradient id="cyanFoil" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d6fbff"/>
      <stop offset="0.5" stop-color="#7DE0F0"/>
      <stop offset="1" stop-color="#1c9fc4"/>
    </linearGradient>
    <linearGradient id="cyanFoilDk" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7DE0F0"/>
      <stop offset="1" stop-color="#166b8c"/>
    </linearGradient>
    <linearGradient id="magFoil" x1="1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffc4ef"/>
      <stop offset="0.5" stop-color="#E85CC0"/>
      <stop offset="1" stop-color="#8f2472"/>
    </linearGradient>
    <linearGradient id="magFoilDk" x1="1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E85CC0"/>
      <stop offset="1" stop-color="#6b1a56"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.5" stop-color="#F5D142"/>
      <stop offset="1" stop-color="#b8880f"/>
    </linearGradient>
    <linearGradient id="goldFoilDk" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F5D142"/>
      <stop offset="1" stop-color="#8a6510"/>
    </linearGradient>

    <!-- Bordure crantée dorée -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.25" stop-color="#F5D142"/>
      <stop offset="0.5" stop-color="#c99818"/>
      <stop offset="0.75" stop-color="#F5D142"/>
      <stop offset="1" stop-color="#8a6510"/>
    </linearGradient>

    <!-- Table blanche du cristal (point de lumière) -->
    <linearGradient id="tableTop" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eafbff"/>
      <stop offset="1" stop-color="#bff2ff"/>
    </linearGradient>

    <!-- Bandes prismatiques diagonales dures (effet foil balayé) -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#7DE0F0"/>
      <stop offset="0.33" stop-color="#7DE0F0"/>
      <stop offset="0.34" stop-color="#F5D142"/>
      <stop offset="0.66" stop-color="#F5D142"/>
      <stop offset="0.67" stop-color="#E85CC0"/>
      <stop offset="1"    stop-color="#E85CC0"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c8f6ff"/>
      <stop offset="1" stop-color="#7DE0F0" stop-opacity="0"/>
    </radialGradient>

    <!-- Rayon d'énergie (ambiance "rays") -->
    <path id="ray" d="M0 0 L600 -30 L600 30 Z"/>
    <path id="spark" d="M0 -16 Q2.6 -2.6 16 0 Q2.6 2.6 0 16 Q-2.6 2.6 -16 0 Q-2.6 -2.6 0 -16 Z"/>
    <path id="star" d="M0 -16 L4 -5.4 L15 -5 L6.4 2 L9.4 12.8 L0 6.6 L-9.4 12.8 L-6.4 2 L-15 -5 L-4 -5.4 Z"/>

    <!-- Coin cranté façon carte de jeu -->
    <g id="notch">
      <path d="M20 96 L20 44 Q20 20 44 20 L96 20" fill="none" stroke="url(#frame)" stroke-width="4"/>
      <path d="M46 34 L60 48 L46 62 L32 48 Z" fill="url(#magFoil)" stroke="#F5D142" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- ===== Fond ===== -->
  <rect x="0" y="0" width="856" height="540" fill="url(#bg)"/>
  <rect x="0" y="0" width="856" height="540" fill="url(#bgGlow)"/>

  <!-- Rayons d'énergie derrière le héros (centre décalé à droite, hors zone puce) -->
  <g opacity="0.1">
    <use href="#ray" transform="translate(560 268) rotate(4) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(26) scale(1.5)" fill="#E85CC0"/>
    <use href="#ray" transform="translate(560 268) rotate(48) scale(1.5)" fill="#F5D142"/>
    <use href="#ray" transform="translate(560 268) rotate(70) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(92) scale(1.5)" fill="#E85CC0"/>
    <use href="#ray" transform="translate(560 268) rotate(114) scale(1.5)" fill="#F5D142"/>
    <use href="#ray" transform="translate(560 268) rotate(136) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(158) scale(1.5)" fill="#E85CC0"/>
    <use href="#ray" transform="translate(560 268) rotate(180) scale(1.5)" fill="#F5D142"/>
    <use href="#ray" transform="translate(560 268) rotate(202) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(224) scale(1.5)" fill="#E85CC0"/>
    <use href="#ray" transform="translate(560 268) rotate(246) scale(1.5)" fill="#F5D142"/>
    <use href="#ray" transform="translate(560 268) rotate(268) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(290) scale(1.5)" fill="#E85CC0"/>
    <use href="#ray" transform="translate(560 268) rotate(312) scale(1.5)" fill="#F5D142"/>
    <use href="#ray" transform="translate(560 268) rotate(334) scale(1.5)" fill="#7DE0F0"/>
    <use href="#ray" transform="translate(560 268) rotate(356) scale(1.5)" fill="#E85CC0"/>
  </g>

  <!-- Décor très léger dans la zone puce (x70-230 / y160-320) : rien d'important -->
  <g opacity="0.14">
    <use href="#star" transform="translate(150 240) scale(4.4)" fill="none" stroke="#7DE0F0" stroke-width="0.7"/>
    <use href="#spark" transform="translate(96 150) scale(0.6)" fill="#F5D142"/>
    <use href="#spark" transform="translate(210 336) scale(0.5)" fill="#E85CC0"/>
  </g>

  <!-- Lueur centrale sous le héros -->
  <circle cx="560" cy="262" r="180" fill="url(#halo)" opacity="0.55"/>

  <!-- ===== HÉROS : gemme foil prismatique plein cadre, centrée-décalée à droite ===== -->
  <g transform="translate(560 262)">
    <!-- ombre portée / assise -->
    <ellipse cx="6" cy="196" rx="150" ry="26" fill="#000000" opacity="0.28"/>

    <!-- COURONNE (haut) : anneau de facettes en aplats francs -->
    <!-- facette gauche haute -->
    <path d="M-150 -78 L-70 -150 L-30 -108 L-96 -46 Z" fill="url(#cyanFoil)" stroke="#0c0722" stroke-width="2.5"/>
    <path d="M-96 -46 L-30 -108 L0 -128 L-38 -46 Z" fill="url(#cyanFoilDk)" stroke="#0c0722" stroke-width="2.5"/>
    <!-- facette sommet gauche -->
    <path d="M-70 -150 L0 -184 L0 -128 L-30 -108 Z" fill="url(#cyanFoil)" stroke="#0c0722" stroke-width="2.5"/>
    <!-- facette sommet droite -->
    <path d="M0 -184 L70 -150 L30 -108 L0 -128 Z" fill="url(#goldFoil)" stroke="#0c0722" stroke-width="2.5"/>
    <!-- facette droite haute -->
    <path d="M70 -150 L150 -78 L96 -46 L30 -108 Z" fill="url(#goldFoilDk)" stroke="#0c0722" stroke-width="2.5"/>
    <path d="M96 -46 L30 -108 L0 -128 L38 -46 Z" fill="url(#magFoil)" stroke="#0c0722" stroke-width="2.5"/>

    <!-- TABLE centrale (grand losange blanc lumineux = point d'éclat) -->
    <path d="M0 -128 L96 -46 L0 40 L-96 -46 Z" fill="url(#tableTop)" stroke="#0c0722" stroke-width="2.5"/>
    <!-- refends de la table (arêtes prismatiques dures) -->
    <path d="M0 -128 L0 40" stroke="#7DE0F0" stroke-width="2.4" stroke-opacity="0.7"/>
    <path d="M-96 -46 L96 -46" stroke="#E85CC0" stroke-width="2.4" stroke-opacity="0.55"/>
    <path d="M-52 -87 L52 -5" stroke="#F5D142" stroke-width="1.8" stroke-opacity="0.5"/>
    <path d="M52 -87 L-52 -5" stroke="#7DE0F0" stroke-width="1.8" stroke-opacity="0.5"/>

    <!-- PAVILLON (bas) : grandes facettes triangulaires colorées convergeant en pointe -->
    <path d="M-150 -78 L-96 -46 L-30 92 L-96 4 Z" fill="url(#cyanFoilDk)" stroke="#0c0722" stroke-width="2.5"/>
    <path d="M-96 -46 L0 40 L-30 92 Z"            fill="url(#cyanFoil)"   stroke="#0c0722" stroke-width="2.5"/>
    <path d="M0 40 L-30 92 L0 200 Z"             fill="url(#cyanFoilDk)" stroke="#0c0722" stroke-width="2.5"/>
    <path d="M0 40 L30 92 L0 200 Z"              fill="url(#magFoilDk)"  stroke="#0c0722" stroke-width="2.5"/>
    <path d="M96 -46 L0 40 L30 92 Z"             fill="url(#magFoil)"    stroke="#0c0722" stroke-width="2.5"/>
    <path d="M150 -78 L96 -46 L30 92 L96 4 Z"   fill="url(#goldFoilDk)" stroke="#0c0722" stroke-width="2.5"/>
    <path d="M-96 -46 L-30 92 L0 40 Z"          fill="none"/>
    <!-- arêtes vives du pavillon -->
    <path d="M-96 -46 L0 200" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.4"/>
    <path d="M96 -46 L0 200"  stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.4"/>
    <path d="M0 40 L0 200"    stroke="#ffffff" stroke-width="2"   stroke-opacity="0.55"/>

    <!-- reflets étoile (éclats francs) -->
    <path d="M-30 -96 L-16 -80 L-32 -66 L-44 -82 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M40 -30 L50 -18 L40 -4 L30 -18 Z"      fill="#ffffff" opacity="0.7"/>
    <path d="M-10 6 L-2 16 L-10 28 L-18 16 Z"        fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Éclats holo autour du héros (hors zone puce) -->
  <use href="#spark" transform="translate(408 150) scale(0.8)" fill="#ffffff" opacity="0.95"/>
  <use href="#spark" transform="translate(742 168) scale(1.05)" fill="#7DE0F0"/>
  <use href="#spark" transform="translate(770 380) scale(0.7)" fill="#E85CC0"/>
  <use href="#spark" transform="translate(392 420) scale(0.6)" fill="#F5D142" opacity="0.9"/>
  <use href="#star" transform="translate(730 456) scale(0.5)" fill="#F5D142" opacity="0.85"/>
  <use href="#star" transform="translate(360 300) scale(0.4)" fill="#7DE0F0" opacity="0.65"/>

  <!-- ===== UN SEUL mot iconique, discret, en bas ===== -->
  <text x="560" y="500" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="30" font-weight="bold" letter-spacing="10" fill="#F5D142" opacity="0.92">HOLO</text>
  <use href="#star" transform="translate(462 491) scale(0.42)" fill="url(#goldFoil)" stroke="#8a6510" stroke-width="1"/>
  <use href="#star" transform="translate(658 491) scale(0.42)" fill="url(#goldFoil)" stroke="#8a6510" stroke-width="1"/>

  <!-- ===== Bordure crantée façon carte de jeu (plein bord, coins droits) ===== -->
  <rect x="9" y="9" width="838" height="522" fill="none" stroke="url(#frame)" stroke-width="18"/>
  <rect x="2" y="2" width="852" height="536" fill="none" stroke="#8a6510" stroke-width="4"/>
  <rect x="21" y="21" width="814" height="498" fill="none" stroke="#7DE0F0" stroke-width="1.4" stroke-opacity="0.45"/>
  <use href="#notch"/>
  <use href="#notch" transform="translate(856 0) scale(-1 1)"/>
  <use href="#notch" transform="translate(0 540) scale(1 -1)"/>
  <use href="#notch" transform="translate(856 540) scale(-1 -1)"/>

  <!-- ===== Bandes prismatiques foil balayées (aplats francs, pas de dégradé pastel) ===== -->
  <g opacity="0.16" clip-path="none">
    <rect x="300" y="-260" width="150" height="1060" fill="url(#sweep)" transform="rotate(-26 428 270)"/>
    <rect x="520" y="-260" width="52"  height="1060" fill="url(#sweep)" transform="rotate(-26 428 270)"/>
    <rect x="640" y="-260" width="90"  height="1060" fill="url(#sweep)" opacity="0.8" transform="rotate(-26 428 270)"/>
  </g>
</svg>
