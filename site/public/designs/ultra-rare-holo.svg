<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540">
  <title>Ultra-Rare 1/1 — Édition Secrète</title>
  <defs>
    <radialGradient id="bgGrad" cx="0.52" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#45247f"/>
      <stop offset="0.55" stop-color="#31165e"/>
      <stop offset="1" stop-color="#1d0b3c"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.45" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#dc9f2b"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#f0b93c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ecff"/>
      <stop offset="0.5" stop-color="#3ec9ff"/>
      <stop offset="1" stop-color="#1489cf"/>
    </linearGradient>
    <linearGradient id="artBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a86"/>
      <stop offset="1" stop-color="#221045"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37195f"/>
      <stop offset="1" stop-color="#22104a"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ec9ff"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="0.75" stop-color="#8a4fd8"/>
      <stop offset="1" stop-color="#3ec9ff"/>
    </linearGradient>

    <path id="ray" d="M0 0 L560 -30 L560 30 Z"/>
    <path id="star" d="M0 -16 L4 -5.5 L15.2 -4.9 L6.5 2.1 L9.4 12.9 L0 6.8 L-9.4 12.9 L-6.5 2.1 L-15.2 -4.9 L-4 -5.5 Z"/>
    <path id="spark" d="M0 -14 Q2.2 -2.2 14 0 Q2.2 2.2 0 14 Q-2.2 2.2 -14 0 Q-2.2 -2.2 0 -14 Z"/>

    <g id="plume">
      <path d="M0 0 C-40 -16 -108 -26 -152 -12 C-156 -8 -156 -2 -150 3 C-106 14 -44 12 0 7 Z" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="2"/>
      <path d="M-152 -12 C-131 -17 -113 -17 -96 -11 C-113 -2 -131 0 -150 3 C-156 -2 -156 -8 -152 -12 Z" fill="#3ec9ff" stroke="#6b3f0e" stroke-width="1.5"/>
    </g>

    <g id="corn">
      <path d="M26 96 L26 44 Q26 26 44 26 L96 26" fill="none" stroke="#ffe9a0" stroke-width="3"/>
      <path d="M44 28 L58 44 L44 60 L30 44 Z" fill="#3ec9ff" stroke="#ffd75e" stroke-width="2"/>
    </g>

    <clipPath id="artClip"><rect x="267" y="137" width="526" height="228"/></clipPath>
  </defs>

  <!-- ===== Fond + rayons d'ambiance ===== -->
  <rect x="0" y="0" width="856" height="540" fill="url(#bgGrad)"/>
  <g fill="#a678e8" opacity="0.08">
    <use href="#ray" transform="translate(428 300) rotate(10) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(30) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(50) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(70) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(90) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(110) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(130) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(150) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(170) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(190) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(210) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(230) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(250) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(270) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(290) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(310) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(330) scale(1.9)"/>
    <use href="#ray" transform="translate(428 300) rotate(350) scale(1.9)"/>
  </g>

  <!-- Décor discret colonne gauche (zone puce : uniquement du fond) -->
  <use href="#star" transform="translate(152 240) scale(6.8)" fill="none" stroke="#ffd75e" stroke-opacity="0.12" stroke-width="0.45"/>
  <use href="#star" transform="translate(152 240) scale(4.4) rotate(18)" fill="none" stroke="#3ec9ff" stroke-opacity="0.1" stroke-width="0.5"/>
  <use href="#spark" transform="translate(150 130) scale(0.5)" fill="#ffe9a0" opacity="0.8"/>
  <use href="#spark" transform="translate(56 250) scale(0.35)" fill="#9fe8ff" opacity="0.7"/>
  <use href="#spark" transform="translate(150 346) scale(0.45)" fill="#ffe9a0" opacity="0.75"/>

  <!-- ===== Bandeau nom (haut) ===== -->
  <rect x="64" y="44" width="728" height="64" rx="10" fill="url(#plateGrad)" stroke="#ffd75e" stroke-width="2.5"/>
  <use href="#star" transform="translate(90 72) scale(0.62)" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="1.6"/>
  <text x="114" y="80" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="27" font-weight="bold" letter-spacing="2" fill="#ffe9a0">PHÉNIX SOLAIRE</text>
  <text x="114" y="100" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="bold" letter-spacing="4" fill="#3ec9ff">ULTRA-RARE — CARTE SECRÈTE</text>
  <text x="766" y="86" text-anchor="end" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" fill="#3ec9ff">PV 9999</text>

  <!-- ===== Fenêtre d'illustration ===== -->
  <g clip-path="url(#artClip)">
    <rect x="267" y="137" width="526" height="228" fill="url(#artBg)"/>
    <ellipse cx="530" cy="370" rx="300" ry="70" fill="#3ec9ff" opacity="0.18"/>
    <!-- Rayons dorés derrière le phénix -->
    <g fill="#ffd75e" opacity="0.15">
      <use href="#ray" transform="translate(530 246) rotate(15)"/>
      <use href="#ray" transform="translate(530 246) rotate(45)"/>
      <use href="#ray" transform="translate(530 246) rotate(75)"/>
      <use href="#ray" transform="translate(530 246) rotate(105)"/>
      <use href="#ray" transform="translate(530 246) rotate(135)"/>
      <use href="#ray" transform="translate(530 246) rotate(165)"/>
      <use href="#ray" transform="translate(530 246) rotate(195)"/>
      <use href="#ray" transform="translate(530 246) rotate(225)"/>
      <use href="#ray" transform="translate(530 246) rotate(255)"/>
      <use href="#ray" transform="translate(530 246) rotate(285)"/>
      <use href="#ray" transform="translate(530 246) rotate(315)"/>
      <use href="#ray" transform="translate(530 246) rotate(345)"/>
    </g>
    <!-- Disque solaire -->
    <circle cx="530" cy="246" r="82" fill="url(#sunGrad)"/>
    <circle cx="530" cy="246" r="94" fill="none" stroke="#ffd75e" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="530" cy="246" r="104" fill="none" stroke="#3ec9ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 10" stroke-linecap="round"/>

    <!-- Ailes -->
    <g transform="translate(500 244)">
      <use href="#plume" transform="rotate(42)"/>
      <use href="#plume" transform="rotate(24)"/>
      <use href="#plume" transform="rotate(6)"/>
      <use href="#plume" transform="rotate(-12)"/>
    </g>
    <g transform="translate(560 244) scale(-1 1)">
      <use href="#plume" transform="rotate(42)"/>
      <use href="#plume" transform="rotate(24)"/>
      <use href="#plume" transform="rotate(6)"/>
      <use href="#plume" transform="rotate(-12)"/>
    </g>

    <!-- Queue -->
    <path d="M516 306 C496 328 502 346 480 360 C508 356 520 332 524 308 Z" fill="#a678e8" stroke="#5b2fa0" stroke-width="1.5"/>
    <path d="M544 306 C564 328 558 346 580 360 C552 356 540 332 536 308 Z" fill="#a678e8" stroke="#5b2fa0" stroke-width="1.5"/>
    <path d="M524 310 C516 338 534 346 528 362 C544 352 544 330 536 310 Z" fill="#3ec9ff" stroke="#1489cf" stroke-width="1.5"/>

    <!-- Corps -->
    <path d="M530 194 C507 211 499 240 506 272 C512 298 521 311 530 319 C539 311 548 298 554 272 C561 240 553 211 530 194 Z" fill="url(#bodyGrad)" stroke="#6b3f0e" stroke-width="2.5"/>
    <path d="M530 214 C518 225 513 245 518 266 C522 284 526 293 530 298 C534 293 538 284 542 266 C547 245 542 225 530 214 Z" fill="#ffe9a0" opacity="0.9"/>

    <!-- Crête, tête, bec, yeux -->
    <path d="M530 170 Q524 152 530 132 Q536 152 530 170 Z" fill="#3ec9ff" stroke="#1489cf" stroke-width="1"/>
    <path d="M521 172 Q510 160 511 146 Q521 160 524 171 Z" fill="#ffd75e" stroke="#b07f1c" stroke-width="1"/>
    <path d="M539 172 Q550 160 549 146 Q539 160 536 171 Z" fill="#ffd75e" stroke="#b07f1c" stroke-width="1"/>
    <circle cx="530" cy="184" r="17" fill="url(#bodyGrad)" stroke="#6b3f0e" stroke-width="2"/>
    <path d="M530 189 L524 196 L530 205 L536 196 Z" fill="#e0a12e" stroke="#6b3f0e" stroke-width="1.5"/>
    <circle cx="523.5" cy="181" r="2.7" fill="#2a1548"/>
    <circle cx="536.5" cy="181" r="2.7" fill="#2a1548"/>

    <!-- Étincelles holo dans l'illustration -->
    <use href="#spark" transform="translate(320 168) scale(0.7)" fill="#ffffff" opacity="0.9"/>
    <use href="#spark" transform="translate(752 202) scale(0.95)" fill="#ffe9a0"/>
    <use href="#spark" transform="translate(700 326) scale(0.6)" fill="#9fe8ff"/>
    <use href="#spark" transform="translate(352 322) scale(0.5)" fill="#ffffff" opacity="0.85"/>
    <use href="#spark" transform="translate(614 150) scale(0.45)" fill="#9fe8ff"/>
    <use href="#spark" transform="translate(586 170) scale(0.4)" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Cadre de la fenêtre + étiquette HOLO -->
  <rect x="260" y="130" width="540" height="242" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="266" y="136" width="528" height="230" fill="none" stroke="#6b3f0e" stroke-width="2"/>
  <rect x="686" y="146" width="100" height="24" rx="5" fill="#22104a" fill-opacity="0.9" stroke="#ffd75e" stroke-width="1.5"/>
  <use href="#spark" transform="translate(700 158) scale(0.28)" fill="#3ec9ff"/>
  <use href="#spark" transform="translate(772 158) scale(0.28)" fill="#3ec9ff"/>
  <text x="736" y="163" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="13" font-weight="bold" letter-spacing="3" fill="#ffd75e">HOLO</text>

  <!-- ===== Barre d'attaque ===== -->
  <rect x="260" y="386" width="540" height="46" rx="9" fill="#22104a" fill-opacity="0.92" stroke="#c9a23e" stroke-width="2"/>
  <circle cx="290" cy="409" r="13" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="1.8"/>
  <use href="#star" transform="translate(290 409) scale(0.55)" fill="#6b3f0e"/>
  <circle cx="324" cy="409" r="13" fill="url(#cyanGrad)" stroke="#0e5f8f" stroke-width="1.8"/>
  <use href="#star" transform="translate(324 409) scale(0.55)" fill="#ffffff"/>
  <text x="348" y="417" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="21" font-weight="bold" fill="#ffe9a0">Éclat Secret</text>
  <line x1="520" y1="409" x2="716" y2="409" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <text x="788" y="418" text-anchor="end" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#ffd75e">9999</text>

  <!-- Texte d'ambiance -->
  <text x="530" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#c9b6ef">« Un seul exemplaire au monde… et il dort dans ton portefeuille. »</text>

  <!-- ===== Bandeau collection (bas) ===== -->
  <rect x="64" y="462" width="728" height="48" rx="10" fill="url(#plateGrad)" stroke="#ffd75e" stroke-width="2.5"/>
  <use href="#star" transform="translate(94 486) scale(0.95)" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="1.6"/>
  <use href="#star" transform="translate(128 486) scale(0.95)" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="1.6"/>
  <use href="#star" transform="translate(162 486) scale(0.95)" fill="url(#goldGrad)" stroke="#6b3f0e" stroke-width="1.6"/>
  <text x="430" y="494" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="24" font-weight="bold" letter-spacing="2" fill="#ffd75e">1/1 — ÉDITION SECRÈTE</text>
  <path d="M690 478 L698 486 L690 494 L682 486 Z" fill="#3ec9ff" stroke="#1489cf" stroke-width="1"/>
  <text x="776" y="492" text-anchor="end" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="15" font-weight="bold" fill="#c9b6ef">001/001</text>

  <!-- ===== Cadre or de la carte (plein bord, coins droits) ===== -->
  <rect x="9" y="9" width="838" height="522" fill="none" stroke="url(#goldGrad)" stroke-width="18"/>
  <rect x="2" y="2" width="852" height="536" fill="none" stroke="#8a5a16" stroke-width="4"/>
  <rect x="20" y="20" width="816" height="500" fill="none" stroke="#6b3f0e" stroke-width="2.5"/>
  <use href="#corn"/>
  <use href="#corn" transform="translate(856 0) scale(-1 1)"/>
  <use href="#corn" transform="translate(0 540) scale(1 -1)"/>
  <use href="#corn" transform="translate(856 540) scale(-1 -1)"/>

  <!-- ===== Éclat holographique global ===== -->
  <g opacity="0.14">
    <rect x="470" y="-220" width="130" height="1000" fill="url(#holoGrad)" transform="rotate(-24 428 270)"/>
    <rect x="642" y="-220" width="48" height="1000" fill="url(#holoGrad)" transform="rotate(-24 428 270)"/>
    <rect x="130" y="-220" width="80" height="1000" fill="url(#holoGrad)" opacity="0.7" transform="rotate(-24 428 270)"/>
  </g>
</svg>
