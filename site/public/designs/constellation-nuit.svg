<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540" role="img" aria-label="Constellation Nuit - signe astrologique en pointilles dores sur ciel de nuit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#151a45"/>
      <stop offset="0.45" stop-color="#0e1436"/>
      <stop offset="1" stop-color="#070a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#1a2255" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#141a44" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070a22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dd93"/>
      <stop offset="0.5" stop-color="#e6c15a"/>
      <stop offset="1" stop-color="#b98f34"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d585"/>
      <stop offset="1" stop-color="#c99f42"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4cf" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#e6c15a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6c15a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f5e6b8"/>
      <stop offset="1" stop-color="#d8b256"/>
    </radialGradient>
  </defs>

  <!-- Deep night sky -->
  <rect width="856" height="540" fill="url(#sky)"/>
  <rect width="856" height="540" fill="url(#glow)"/>

  <!-- Fine dotted starfield (small, evenly scattered - stays away from chip window) -->
  <g fill="#c9d2f2">
    <circle cx="300" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="360" cy="110" r="1" opacity="0.5"/>
    <circle cx="430" cy="52" r="1.4" opacity="0.8"/>
    <circle cx="500" cy="100" r="1" opacity="0.5"/>
    <circle cx="560" cy="46" r="1.2" opacity="0.7"/>
    <circle cx="640" cy="92" r="1" opacity="0.55"/>
    <circle cx="710" cy="58" r="1.3" opacity="0.7"/>
    <circle cx="780" cy="120" r="1" opacity="0.5"/>
    <circle cx="330" cy="180" r="1" opacity="0.5"/>
    <circle cx="270" cy="130" r="0.9" opacity="0.45"/>
    <circle cx="600" cy="150" r="1.1" opacity="0.6"/>
    <circle cx="820" cy="200" r="1" opacity="0.5"/>
    <circle cx="760" cy="250" r="1.2" opacity="0.6"/>
    <circle cx="690" cy="320" r="1" opacity="0.5"/>
    <circle cx="810" cy="360" r="1.1" opacity="0.55"/>
    <circle cx="620" cy="420" r="1" opacity="0.5"/>
    <circle cx="720" cy="470" r="1.2" opacity="0.6"/>
    <circle cx="800" cy="490" r="1" opacity="0.5"/>
    <circle cx="540" cy="470" r="1" opacity="0.5"/>
    <circle cx="470" cy="500" r="1.1" opacity="0.55"/>
    <circle cx="400" cy="440" r="0.9" opacity="0.45"/>
    <circle cx="340" cy="490" r="1" opacity="0.5"/>
    <circle cx="290" cy="430" r="1" opacity="0.5"/>
    <circle cx="250" cy="370" r="0.9" opacity="0.4"/>
    <circle cx="880" cy="300" r="1" opacity="0.4"/>
  </g>

  <!-- Twinkle 4-point stars scattered in gold -->
  <g fill="url(#goldSoft)">
    <path d="M405 130 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.85"/>
    <path d="M675 175 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4 z" opacity="0.8"/>
    <path d="M780 415 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity="0.75"/>
    <path d="M320 250 l1.8 5.4 5.4 1.8 -5.4 1.8 -1.8 5.4 -1.8 -5.4 -5.4 -1.8 5.4 -1.8 z" opacity="0.7"/>
    <path d="M560 380 l2.2 6.5 6.5 2.2 -6.5 2.2 -2.2 6.5 -2.2 -6.5 -6.5 -2.2 6.5 -2.2 z" opacity="0.75"/>
  </g>

  <!-- Crescent moon top-right -->
  <g>
    <circle cx="770" cy="90" r="30" fill="url(#moon)" opacity="0.95"/>
    <circle cx="782" cy="82" r="27" fill="#0c1132"/>
    <circle cx="770" cy="90" r="30" fill="none" stroke="#f0d585" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ============ CONSTELLATION (Scorpio hero) ============ -->
  <!-- Positioned in the open right/center area, clear of chip window -->
  <g stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" stroke-dasharray="2 6">
    <path d="M410 210 L470 240 L520 250 L560 235 L600 250 L640 300 L655 355 L640 400 L595 425 L560 420 L565 380"/>
    <path d="M410 210 L385 175"/>
    <path d="M410 210 L375 235"/>
  </g>

  <!-- Constellation star nodes (bright dotted points) -->
  <g>
    <g fill="url(#starGlow)">
      <circle cx="410" cy="210" r="12"/>
      <circle cx="470" cy="240" r="9"/>
      <circle cx="520" cy="250" r="9"/>
      <circle cx="560" cy="235" r="8"/>
      <circle cx="600" cy="250" r="9"/>
      <circle cx="640" cy="300" r="10"/>
      <circle cx="655" cy="355" r="9"/>
      <circle cx="640" cy="400" r="9"/>
      <circle cx="595" cy="425" r="11"/>
      <circle cx="560" cy="420" r="8"/>
      <circle cx="565" cy="380" r="8"/>
      <circle cx="385" cy="175" r="8"/>
      <circle cx="375" cy="235" r="8"/>
    </g>
    <g fill="#fff6d8">
      <circle cx="410" cy="210" r="4.2"/>
      <circle cx="470" cy="240" r="3.2"/>
      <circle cx="520" cy="250" r="3.2"/>
      <circle cx="560" cy="235" r="2.8"/>
      <circle cx="600" cy="250" r="3.2"/>
      <circle cx="640" cy="300" r="3.6"/>
      <circle cx="655" cy="355" r="3.2"/>
      <circle cx="640" cy="400" r="3.2"/>
      <circle cx="595" cy="425" r="3.8"/>
      <circle cx="560" cy="420" r="2.8"/>
      <circle cx="565" cy="380" r="2.8"/>
      <circle cx="385" cy="175" r="2.8"/>
      <circle cx="375" cy="235" r="2.8"/>
    </g>
  </g>

  <!-- ============ ZODIAC GLYPH (Scorpio) in foil gold ============ -->
  <!-- Large, legible, lower-center area -->
  <g transform="translate(400 460)">
    <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-70 -22 v34 a11 11 0 0 0 22 0 v-34"/>
      <path d="M-48 -22 v34 a11 11 0 0 0 22 0 v-34"/>
      <path d="M-26 -22 v40 a11 11 0 0 0 22 0 v-2"/>
      <path d="M-4 16 l18 0 l-8 -12 m8 12 l-12 8"/>
    </g>
  </g>

  <!-- ============ Word mark ============ -->
  <text x="428" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="url(#gold)" opacity="0.96">SCORPIO</text>
  <text x="428" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="6" fill="#c9b06a" opacity="0.75">OCT 23 &#8212; NOV 21</text>

  <!-- Elegant thin gold frame (full-bleed inset, no rounded corners) -->
  <rect x="14" y="14" width="828" height="512" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.55"/>
  <rect x="20" y="20" width="816" height="500" fill="none" stroke="#e6c15a" stroke-width="0.6" opacity="0.3"/>

  <!-- Corner flourishes (kept out of chip window) -->
  <g stroke="url(#gold)" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M14 60 v-30 a16 16 0 0 1 16 -16 h30"/>
    <path d="M842 60 v-30 a16 16 0 0 0 -16 -16 h-30"/>
    <path d="M842 480 v30 a16 16 0 0 1 -16 16 h-30"/>
    <path d="M14 480 v30 a16 16 0 0 0 16 16 h30"/>
  </g>
</svg>
